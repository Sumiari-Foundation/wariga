name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

jobs:
  # Continuous Integration Job
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run Build
        run: bun run build
        continue-on-error: false

      - name: Run tests
        run: bun test
        continue-on-error: false

      - name: Verify the Node.js package entry
        run: node --input-type=module -e "import { getWariga } from './dist/index.js'; const result = getWariga('2026-03-19'); if (result.pawukon.wuku?.name !== 'klawu' || result.saka.sasih.sasihName !== 'Kanam') process.exit(1);"